name: Publish Quarto Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render Quarto Project
        run: quarto render
        working-directory: Site-quarto

      - name: Check rendered files
        run: |
          echo "Quarto project contents:"
          ls -la Site-quarto
          echo "_site contents:"
          ls -la Site-quarto/_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: Site-quarto/_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
